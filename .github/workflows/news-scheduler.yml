name: ニュースの定期取得

on:
  schedule:
    # 設定画面の時刻・頻度を反映できるよう15分ごとに確認し、期限到来時だけ取得する。
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: news-scheduler
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run news:test
      - name: 設定時刻を迎えたニュースを取得
        env:
          NEWS_SCHEDULER_URL: https://my-app-orcin-gamma-50.vercel.app/api/news-sync
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]]; then separator='&'; fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=my-app-news-scheduler")"
          token="$(printf '%s' "$response" | node -e \
            "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).value));")"
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 150 \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"scheduled"}' \
            "$NEWS_SCHEDULER_URL"
