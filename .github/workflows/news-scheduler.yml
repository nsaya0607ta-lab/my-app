name: ニュースの定期取得

on:
  schedule:
    # 設定画面の時刻・頻度を反映できるよう15分ごとに確認し、期限到来時だけ取得する。
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-scheduler
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run news:test
      - name: 設定時刻を迎えたニュースを取得
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_FEED_JAPAN_URL: ${{ vars.NEWS_FEED_JAPAN_URL }}
          NEWS_FEED_WORLD_URL: ${{ vars.NEWS_FEED_WORLD_URL }}
          NEWS_FEED_STOCKS_URL: ${{ vars.NEWS_FEED_STOCKS_URL }}
        run: npm run news:scheduled
