name: Vercelデプロイ用ソース書き出し

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-vercel-source.yml'
      - 'pdf-manager/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: デプロイ対象をアーカイブ
        uses: actions/upload-artifact@v4
        with:
          name: pdf-manager-vercel-source
          path: |
            pdf-manager
            !pdf-manager/node_modules
            !pdf-manager/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
