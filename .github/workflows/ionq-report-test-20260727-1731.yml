name: IONQレポート17時31分一時テスト

on:
  schedule:
    - cron: '31 17 27 7 *'
      timezone: 'Asia/Tokyo'

concurrency:
  group: ionq-daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 最新mainを同期
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: 実行日時を確認
        id: test_check
        shell: bash
        run: |
          REPORT_DATE="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          if [ "$REPORT_DATE" = "2026-07-27" ]; then
            echo "should_generate=true" >> "$GITHUB_OUTPUT"
            echo "17:31の一時テストとしてIONQレポートを再生成します"
          else
            echo "should_generate=false" >> "$GITHUB_OUTPUT"
            echo "対象日ではないため生成しません"
          fi

      - name: 日本語フォントを導入
        if: steps.test_check.outputs.should_generate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 依存関係を導入
        if: steps.test_check.outputs.should_generate == 'true'
        run: npm ci

      - name: Chromiumを導入
        if: steps.test_check.outputs.should_generate == 'true'
        run: npx puppeteer browsers install chrome

      - name: IONQレポートを生成
        if: steps.test_check.outputs.should_generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: npm run ionq-report

      - name: 生成物をコミット
        if: steps.test_check.outputs.should_generate == 'true'
        run: |
          if [ -z "$(git status --porcelain pdf-manager/public/ionq)" ]; then
            echo "生成物に変更がないためコミットしません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-manager/public/ionq
          git commit -m "IONQ日次レポート17時31分テスト: 2026-07-27"
          git pull --rebase origin main
          git push origin HEAD:main
