name: 火〜土のIONQデイリーレポートPDF

on:
  schedule:
    # 日本時間の火〜土7:00に通常実行し、未作成の場合だけ7:10・7:20・7:30に再試行する。
    - cron: '0 7 * * 2-6'
      timezone: 'Asia/Tokyo'
    - cron: '10 7 * * 2-6'
      timezone: 'Asia/Tokyo'
    - cron: '20 7 * * 2-6'
      timezone: 'Asia/Tokyo'
    - cron: '30 7 * * 2-6'
      timezone: 'Asia/Tokyo'
    # 一時テスト: 2026-07-27 17:03（日本時間）に1回だけ再生成する。
    - cron: '3 17 27 7 *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
  # ワークフローまたは生成処理を変更した際は、当日分を即時確認・生成する。
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ionq-report.yml'
      - 'scripts/ionq-report/**'

concurrency:
  group: ionq-daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 再試行時に、直前の実行で生成済みかを最新mainで確認する。
      - name: 最新mainを同期
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: 今日のPDF作成状況を確認
        id: report_check
        shell: bash
        run: |
          REPORT_DATE="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          COMPACT_DATE="$(TZ=Asia/Tokyo date +%Y%m%d)"
          DAY_OF_WEEK="$(TZ=Asia/Tokyo date +%u)"
          EXPECTED_FILE="投資_IQ_${COMPACT_DATE}.pdf"
          REPORT_PATH="pdf-manager/public/ionq/${EXPECTED_FILE}"

          # 2026-07-27 17:03の一時テストだけ、月曜日・作成済み判定を無視して再生成する。
          if [ "${{ github.event_name }}" = "schedule" ] \
            && [ "${{ github.event.schedule }}" = "3 17 27 7 *" ] \
            && [ "$REPORT_DATE" = "2026-07-27" ]; then
            echo "should_generate=true" >> "$GITHUB_OUTPUT"
            echo "17:03の一時テストとしてIONQレポートを再生成します"
            exit 0
          fi

          # 日本時間の日曜(7)・月曜(1)は、手動実行やpush起動でも作成しない。
          if [ "$DAY_OF_WEEK" = "1" ] || [ "$DAY_OF_WEEK" = "7" ]; then
            echo "should_generate=false" >> "$GITHUB_OUTPUT"
            echo "日曜・月曜はIONQレポートを作成しません"
            exit 0
          fi

          # 手動実行は既存ファイルがあっても再生成する。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_generate=true" >> "$GITHUB_OUTPUT"
            echo "手動実行のため再生成します"
            exit 0
          fi

          if REPORT_ID="${REPORT_DATE}-ionq" EXPECTED_FILE="$EXPECTED_FILE" REPORT_PATH="$REPORT_PATH" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            if (!fs.existsSync(process.env.REPORT_PATH)) process.exit(1);
            const indexPath = path.join("pdf-manager", "public", "ionq", "index.json");
            const index = JSON.parse(fs.readFileSync(indexPath, "utf8"));
            const found = Array.isArray(index.reports) && index.reports.some(
              (entry) => entry.id === process.env.REPORT_ID && entry.file === process.env.EXPECTED_FILE,
            );
            process.exit(found ? 0 : 1);
          '; then
            echo "should_generate=false" >> "$GITHUB_OUTPUT"
            echo "今日のPDFは作成済みです: ${EXPECTED_FILE}"
          else
            echo "should_generate=true" >> "$GITHUB_OUTPUT"
            echo "今日のPDFがないため生成します: ${EXPECTED_FILE}"
          fi

      - name: 日本語フォントを導入
        if: steps.report_check.outputs.should_generate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 依存関係を導入
        if: steps.report_check.outputs.should_generate == 'true'
        run: npm ci

      - name: Chromiumを導入
        if: steps.report_check.outputs.should_generate == 'true'
        run: npx puppeteer browsers install chrome

      - name: IONQレポートを生成
        if: steps.report_check.outputs.should_generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # 新しいAPIキーではGemini 2.5 Flashが利用できない場合があるため、
          # Googleが現在推奨する安定版Flashモデルを明示して固定する。
          GEMINI_MODEL: gemini-3.6-flash
        run: npm run ionq-report

      - name: 生成物をコミット
        if: steps.report_check.outputs.should_generate == 'true'
        run: |
          if [ -z "$(git status --porcelain pdf-manager/public/ionq)" ]; then
            echo "生成物に変更がないためコミットしません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-manager/public/ionq
          git commit -m "IONQデイリーレポートを追加: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
