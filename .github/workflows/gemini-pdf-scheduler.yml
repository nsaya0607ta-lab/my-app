name: Gemini自動PDF作成

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-pdf-scheduler
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: 日本語フォントを準備
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 依存関係をインストール
        run: npm ci

      - name: Chromeを準備
        run: npx puppeteer browsers install chrome

      - name: 作成時刻を確認してPDFを生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || 'my-az900-app.firebasestorage.app' }}
        run: npm run gemini-pdf-scheduler
