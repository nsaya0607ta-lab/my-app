name: Apply investment accrual time change to main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-investment-accrual-11-jst-main.yml

permissions:
  contents: write

jobs:
  apply-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Change index accrual time from 23:00 to 11:00 JST
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          sec = 'finance/js/securities.js'
          replace_once(
              sec,
              "export const SETTLE_BUSINESS_DAYS = 2;\n// 受渡が反映される日本時間の時刻（この時刻を過ぎた受渡日ぶんを預り金へ反映する）",
              "export const SETTLE_BUSINESS_DAYS = 2;\n// インデックス積立が約定する日本時間の時刻。\nexport const ACCRUAL_HOUR_JST = 11;\n// 受渡が反映される日本時間の時刻（この時刻を過ぎた受渡日ぶんを預り金へ反映する）",
          )
          replace_once(
              sec,
              '// 積立処理（日本時間23:00・ONのインデックスのみ・任意のオプトイン機能）',
              '// 積立処理（日本時間11:00・ONのインデックスのみ・任意のオプトイン機能）',
          )
          replace_once(
              sec,
              '// 23:00 を過ぎて確定済みとみなせる「最新の対象日」。JST23時以降なら今日、未満なら昨日。',
              '// 積立時刻を過ぎて確定済みとみなせる「最新の対象日」。JST11時以降なら今日、未満なら昨日。',
          )
          replace_once(
              sec,
              'if (d.getUTCHours() >= 23) return `${y}-${pad(m + 1)}-${pad(day)}`;',
              'if (d.getUTCHours() >= ACCRUAL_HOUR_JST) return `${y}-${pad(m + 1)}-${pad(day)}`;',
          )
          replace_once(
              sec,
              'h.cost = n(h.cost) + amount;            // ① 総元本へ加算（毎晩23時の積立はここに積み上がる）',
              'h.cost = n(h.cost) + amount;            // ① 総元本へ加算（毎朝11時の積立はここに積み上がる）',
          )

          app = 'finance/js/app.js'
          replace_once(app, "import * as Sec from './securities.js?v=20260725b';", "import * as Sec from './securities.js?v=20260725d';")
          replace_once(
              app,
              "text: 'インデックスの積立を登録できます（日本時間23:00に自動実行）。'",
              "text: `インデックスの積立を登録できます（日本時間${Sec.ACCRUAL_HOUR_JST}:00に自動実行）。`",
          )
          replace_once(
              app,
              "text: 'ONの設定のみ実行されます（実際の自動積立は日本時間23:00に処理されます）'",
              "text: `ONの設定のみ実行されます（実際の自動積立は日本時間${Sec.ACCRUAL_HOUR_JST}:00に処理されます）`",
          )

          replace_once(
              'finance/index.html',
              "import { init } from './js/app.js?v=20260725c';",
              "import { init } from './js/app.js?v=20260725d';",
          )

          for path in (sec, app):
              text = Path(path).read_text(encoding='utf-8')
              if '日本時間23:00' in text or '毎晩23時' in text or 'JST23時' in text:
                  raise SystemExit(f'{path}: an old 23:00 accrual reference remains')
          PY

      - name: Commit applied change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-investment-accrual-11-jst-main.yml
          git add finance/js/securities.js finance/js/app.js finance/index.html
          git commit -m "finance: インデックス積立の約定時刻を日本時間11時へ変更"
          git push origin HEAD:main
